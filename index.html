<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sport Test App</title>

  <!-- PWA-manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">

  <!-- Iconen voor startscherm (iOS/Android) -->
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #f4f6f8;
    }
    #appFrame {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Eenvoudig laadschermpje terwijl de iframe laadt */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #0d6efd;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="loading">⏳ Sport Test App laden...</div>

  <!--
    BELANGRIJK:
    Vervang de URL hieronder door je eigen Apps Script Web App /exec-URL.
    Je vindt deze via: Apps Script editor > Implementeren > Implementaties beheren.
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwN31tX8AQgKRLfETZjTjkIsnpqsE_egdE9n4lYCHLE2cOC3vgftbdEvqFmJ4m9yz9fKg/exec"
    title="Sport Test App"
    allow="fullscreen"
    onload="document.getElementById('loading').style.display='none';">
  </iframe>

  <script>
    // Service worker registreren (nodig om als installeerbare PWA te tellen)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err => {
          console.warn('Service worker registratie mislukt:', err);
        });
      });
    }
  </script>
</body>
</html>
